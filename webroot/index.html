<!-- Add these inside the content div after the summary-grid -->

<!-- Stats Card -->
<div class="stats-card" style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;margin-bottom:16px;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
    <div style="font-weight:700;">📊 Protection Stats</div>
    <button id="refreshStats" class="log-btn">⟳ Refresh</button>
  </div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;">
    <div><div style="font-size:24px;font-weight:800;color:var(--green);" id="statsApplied">0</div><div style="font-size:12px;color:var(--text-secondary);">Applied</div></div>
    <div><div style="font-size:24px;font-weight:800;color:var(--red);" id="statsFailed">0</div><div style="font-size:12px;color:var(--text-secondary);">Failed</div></div>
    <div><div style="font-size:12px;color:var(--text-secondary);" id="statsLastRun">Never</div><div style="font-size:12px;color:var(--text-secondary);">Last Run</div></div>
  </div>
</div>

<!-- Verification & Export Buttons -->
<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
  <button id="verifyBtn" class="btn-pill add" style="background:var(--blue);color:#fff;">✓ Verify</button>
  <button id="exportBtn" class="btn-pill" style="background:var(--elevated);color:var(--text);">📤 Export</button>
  <button id="importBtn" class="btn-pill" style="background:var(--elevated);color:var(--text);">📥 Import</button>
</div>

<!-- Kill History -->
<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;margin-bottom:16px;">
  <div style="font-weight:700;margin-bottom:8px;">💀 Kill History</div>
  <pre id="killHistoryView" style="background:#0d0d0d;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;font-size:11px;color:var(--text-secondary);max-height:100px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;font-family:monospace;">Loading...</pre>
</div>

<!-- Hibernate List Section -->
<div class="section-title">💤 Hibernate List <span class="count-pill" id="hibernateCount">0</span></div>
<div class="app-list" id="hibernateList">
  <div class="empty-state"><div class="empty-title">No hibernated apps</div><div>Add from the app list below</div></div>
</div>
